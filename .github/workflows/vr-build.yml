name: vr-build

# Two-stage CI:
#   1. cardboard-aar – build the Cardboard SDK AAR from third_party source.
#   2. app           – download the AAR, run flutter analyze + build debug APK.
on:
  push:
    branches: [ main, vr-dev ]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENNOW_ABIS: arm64-v8a

jobs:
  cardboard-aar:
    name: build-cardboard-sdk-aar
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build Cardboard SDK AAR
        shell: bash
        run: |
          cd third_party/cardboard
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache :sdk:assembleDebug

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardboard-sdk-aar
          path: third_party/cardboard/sdk/build/outputs/aar/sdk-debug.aar
          if-no-files-found: error

  app:
    name: analyze + build Android debug APK
    needs: cardboard-aar
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build \
            libgtk-3-dev libayatana-appindicator3-dev libasound2-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Download Cardboard SDK AAR
        uses: actions/download-artifact@v4
        with:
          name: cardboard-sdk-aar
          path: third_party/cardboard/sdk/build/outputs/aar

      - name: Place AAR into app/libs
        shell: bash
        run: |
          mkdir -p android/app/libs
          mv -v third_party/cardboard/sdk/build/outputs/aar/sdk-debug.aar \
              android/app/libs/cardboard-sdk.aar

      - name: Flutter pub get
        shell: bash
        run: flutter pub get

      # Upstream CI workaround: the jni package emits a build-id section that
      # breaks the NDK link step. Patch it only when the package is present.
      - name: Patch jni CMakeLists build-id
        shell: bash
        run: |
          for f in ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt; do
            if [ -f "$f" ]; then
              sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$f"
              echo "patched $f"
            fi
          done

      - name: Flutter analyze
        shell: bash
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Build Android debug APK
        shell: bash
        run: flutter build apk --debug --split-per-abi

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p out
          cp -v build/app/outputs/flutter-apk/*.apk out/
          ls -la out

      - name: Verify JNI .so inside APK
        shell: bash
        run: |
          apk=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          echo "Checking APK: $apk"
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/lib.*\.so' || true
          if unzip -l "$apk" | grep -q "libcardboard_sdk_jni.so"; then
            echo "OK: libcardboard_sdk_jni.so found"
          else
            echo "WARN: libcardboard_sdk_jni.so NOT found in APK"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-vr-debug-apk
          path: out/*.apk
          if-no-files-found: error
