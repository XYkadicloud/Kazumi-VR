name: vr-build

# Everything is compiled on GitHub. The local workstation has no Flutter SDK,
# no Android SDK and only JDK 8, so CI is the single source of truth.
#
# Stage 1 builds the Google Cardboard SDK AAR from the vendored upstream source
# (v1.36.0 has NO Maven artifact) and asserts its JNI bridge is really inside.
# Stage 2 builds the Flutter debug APK for arm64-v8a only, runs the r7 pure-JVM
# VR unit tests, and asserts the shipped APK carries both Cardboard .so files.
on:
  push:
    branches: [ main, vr-dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  VR_ABIS: arm64-v8a

jobs:
  cardboard-aar:
    name: build-cardboard-sdk-aar
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages for the Cardboard build
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK at: $SDK"
          SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
          echo "sdk.dir=$SDK" > third_party/cardboard/local.properties

      # GitHub egress to services.gradle.org occasionally times out mid-download.
      # Warm (and cache) gradle-9.8.0-bin.zip with retries before the real build.
      - name: Warm the Gradle distribution
        shell: bash
        working-directory: third_party/cardboard
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3 4 5; do
            echo "Gradle warm-up attempt ${attempt}/5"
            if ./gradlew --version; then
              echo "Gradle distribution ready"
              exit 0
            fi
            echo "Warm-up attempt ${attempt} failed; retrying" >&2
            sleep 10
          done
          echo "FAIL: Gradle distribution could not be downloaded" >&2
          exit 1

      - name: Build sdk-debug.aar (assembleDebug, NOT release)
        shell: bash
        working-directory: third_party/cardboard
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export CMAKE="$SDK/cmake/3.31.6/bin/cmake"
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          # The SDK release build type is minified and would obfuscate its public API.
          ./gradlew --no-daemon --no-configuration-cache :sdk:assembleDebug
          ls -la sdk/build/outputs/aar/

      - name: Verify the Cardboard JNI bridge is in the AAR
        shell: bash
        working-directory: third_party/cardboard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, zipfile
          aars = sorted(glob.glob('sdk/build/outputs/aar/*.aar'))
          print('AARs:', aars)
          found = False
          for path in aars:
              with zipfile.ZipFile(path) as z:
                  jni = sorted(n for n in z.namelist() if n.startswith('jni/') and n.endswith('.so'))
              print(path, 'jni libs:', jni)
              if any(n.endswith('/libcardboard_sdk_jni.so') for n in jni):
                  found = True
          if not found:
              sys.exit('FAIL: libcardboard_sdk_jni.so missing from AAR - VR entry would crash')
          PY

      - name: Upload the AAR
        uses: actions/upload-artifact@v4
        with:
          name: cardboard-sdk-aar
          path: third_party/cardboard/sdk/build/outputs/aar/sdk-debug.aar
          if-no-files-found: error

  app:
    name: analyze + VR JVM tests + arm64 debug APK
    needs: cardboard-aar
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build \
            libgtk-3-dev libayatana-appindicator3-dev libasound2-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Install Android SDK packages for the app build
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Download the Cardboard SDK AAR
        uses: actions/download-artifact@v4
        with:
          name: cardboard-sdk-aar
          path: android/app/libs

      - name: Normalize the AAR filename
        shell: bash
        run: |
          set -euo pipefail
          mv -v android/app/libs/sdk-debug.aar android/app/libs/cardboard-sdk.aar
          ls -la android/app/libs

      - name: Flutter pub get
        shell: bash
        run: flutter pub get

      # Upstream workaround: the jni package emits a build-id section that breaks
      # the NDK link step. Patch it only when the package is present.
      - name: Patch jni CMakeLists build-id
        shell: bash
        run: |
          set -euo pipefail
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          patched=0
          for f in "$CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt; do
            if [ -f "$f" ]; then
              sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$f"
              echo "patched $f"
              patched=$((patched + 1))
            fi
          done
          echo "patched files: $patched"

      - name: Flutter analyze
        shell: bash
        run: flutter analyze --no-fatal-infos --fatal-warnings

      # Cardboard SDK ships ONLY arm64-v8a JNI libs. A split-per-abi build would
      # produce APKs for ABIs that can never start the VR renderer.
      - name: Build Android debug APK (arm64-v8a only)
        shell: bash
        run: flutter build apk --debug --target-platform android-arm64

      - name: Run r7 VR JVM unit tests
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache \
            :app:testDebugUnitTest --tests "com.example.kazumi.vr.*"

      - name: Assert VR JVM tests actually ran
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = sorted(glob.glob('android/app/build/test-results/testDebugUnitTest/TEST-*.xml'))
          suites = tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              for suite in root.iter('testsuite'):
                  suites += 1
                  tests += int(suite.get('tests', 0))
                  failures += int(suite.get('failures', 0))
                  errors += int(suite.get('errors', 0))
                  skipped += int(suite.get('skipped', 0))
              print(' ', path)
          print('VR JVM test suites: %d | tests: %d | failures: %d | errors: %d | skipped: %d'
                % (suites, tests, failures, errors, skipped))
          if not files or suites == 0 or tests == 0:
              sys.exit('FAIL: no VR JVM tests executed')
          if failures or errors:
              sys.exit('FAIL: VR JVM tests reported failures/errors')
          PY

      - name: Collect the APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find build/app/outputs/flutter-apk -name '*.apk' -exec cp -v {} out/ \;
          ls -la out

      - name: Verify the Cardboard JNI bridge is in the APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, zipfile
          apks = sorted(glob.glob('out/*.apk'))
          print('APKs:', apks)
          if not apks:
              sys.exit('FAIL: no APK produced')
          for path in apks:
              with zipfile.ZipFile(path) as z:
                  libs = sorted(n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so'))
              print(path, 'arm64 native libs:', [n for n in libs if 'arm64-v8a' in n])
              for required in ('lib/arm64-v8a/libcardboard_sdk_jni.so',
                               'lib/arm64-v8a/libGfxPluginCardboard.so'):
                  if required not in libs:
                      sys.exit('FAIL: %s missing from APK' % required)
              print('OK: Cardboard JNI + GfxPlugin present in', path)
          PY

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-vr-debug-arm64-v8a
          path: out/*.apk
          if-no-files-found: error

      - name: Upload the VR unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vr-unit-test-report
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
