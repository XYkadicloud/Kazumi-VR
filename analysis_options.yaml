include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - .cache/**
    - .dart_tool/**
    - build/**
    - fastlane/**
    - lib/bbcode/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Vendored third-party sources are separate packages / native SDK trees.
    # They carry their own analysis options and must not be linted as app code.
    - vendor/**
    - third_party/**
